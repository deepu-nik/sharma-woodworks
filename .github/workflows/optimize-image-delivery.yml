name: Optimize image delivery

on:
  push:
    branches:
      - redesign/static-free-v2-latest
    paths:
      - ".github/workflows/optimize-image-delivery.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, 'Optimize image delivery [skip]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/static-free-v2-latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Create web-optimized assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          public = Path("public")

          # Small, sharp logo for the sticky navigation.
          with Image.open(public / "logo.png") as im:
              im = im.convert("RGBA")
              im.thumbnail((512, 512), Image.Resampling.LANCZOS)
              im.save(public / "logo.webp", "WEBP", quality=82, method=6)

              # Keep the PNG favicon/touch icon, but make it much smaller.
              icon = im.copy()
              icon.thumbnail((256, 256), Image.Resampling.LANCZOS)
              icon.save(public / "logo.png", "PNG", optimize=True)

          # Convert portfolio images to WebP without changing their framing.
          for name in ["TvConsole.jpg", "MediaConsole.jpg", "WoodenChest.jpg"]:
              source = public / name
              target = source.with_suffix(".webp")
              with Image.open(source) as im:
                  im = im.convert("RGB")
                  im.save(target, "WEBP", quality=80, method=6)

          PY

      - name: Update source references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "TvConsole.jpg": "TvConsole.webp",
              "MediaConsole.jpg": "MediaConsole.webp",
              "WoodenChest.jpg": "WoodenChest.webp",
          }

          for path in [Path("portfolio.json")]:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          layout = Path("components/Layout.js")
          text = layout.read_text().replace('src="/logo.png"', 'src="/logo.webp"')
          layout.write_text(text)

          seo = Path("components/SEO.js")
          text = seo.read_text()
          text = text.replace('href="/logo.png"', 'href="/logo.png"', 1)
          text = text.replace('href="/logo.png"', 'href="/logo.png"', 1)
          seo.write_text(text)

          index = Path("pages/index.js")
          text = index.read_text()
          text = text.replace('https://sharmawoodworks.com/logo.png', 'https://sharmawoodworks.com/logo.webp')
          index.write_text(text)
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/optimize-image-delivery.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public portfolio.json components/Layout.js pages/index.js .github/workflows/optimize-image-delivery.yml
          git commit -m "Optimize image delivery [skip]"
          git push origin HEAD:redesign/static-free-v2-latest
