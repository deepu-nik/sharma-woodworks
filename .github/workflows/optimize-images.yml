name: One-time image optimization

on:
  push:
    branches:
      - redesign/static-free-v2-latest
    paths:
      - "scripts/optimize-images.py"
      - "public/**"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ !contains(github.event.head_commit.message, 'Optimize production images [skip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: redesign/static-free-v2-latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Optimize and replace images
        run: |
          python scripts/optimize-images.py
          for optimized in public/*.optimized.*; do
            [ -e "$optimized" ] || continue
            original="${optimized/.optimized/}"
            mv "$optimized" "$original"
          done

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Optimize production images [skip]"
          git push origin HEAD:redesign/static-free-v2-latest
